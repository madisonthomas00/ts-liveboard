<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThoughtSpot Liveboard</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; }
    #ts-embed { width: 100%; height: 100vh; }
    #status { padding: 12px 16px; color: #555; }
    #status.error { color: #b00020; background: #fdecea; }
  </style>
</head>
<body>
  <div id="status">Loading liveboard…</div>
  <div id="ts-embed"></div>

  <script type="module">
    import {
      init,
      LiveboardEmbed,
      AuthType,
      EmbedEvent,
    } from "https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js";

    const status = document.getElementById("status");

    // GitHub Pages is static (no backend), so the playground's
    // TrustedAuthTokenCookieless + getTokenService can't be used here.
    // AuthType.None = viewers sign in to ThoughtSpot with their own account.
    init({
      thoughtSpotHost: "https://techpartners.thoughtspot.cloud",
      authType: AuthType.None,
    });

    new LiveboardEmbed("#ts-embed", {
      liveboardId: "31d5c922-167a-4af1-97e4-717dc87be41b",
      isCentralizedLiveboardFilterUXEnabled: true,
      fullHeight: true,
    })
      .on(EmbedEvent.Load, () => { status.style.display = "none"; })
      .on(EmbedEvent.Error, (err) => {
        console.log("ThoughtSpot embed error", err);
        status.className = "error";
        status.style.display = "block";
        status.textContent =
          "The liveboard couldn't load. If this keeps happening, sign in at techpartners.thoughtspot.cloud in another tab, then refresh.";
      })
      .render();
  </script>
</body>
</html>
